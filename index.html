<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="四年级学习台">
<meta name="theme-color" content="#2F6FEB">
<title>四年级学习台 · 太阳城小学</title>
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --line:#E6EAF2; --line2:#EFF2F7;
  --tx:#1E2532; --tx2:#5B6577; --tx3:#8A93A6;
  --main:#2F6FEB; --main-l:#EAF1FE; --main-d:#2358C4;
  --yw:#E8663D; --yw-l:#FDF0EB;
  --sx:#2F6FEB; --sx-l:#EAF1FE;
  --yy:#12A150; --yy-l:#E8F7EE;
  --yy3:#0E9F6E; --yy3-l:#E6F7EF;
  --red:#DC2626; --red-l:#FDECEC;
  --green:#12A150; --green-l:#E8F7EE;
  --amber:#D97706; --amber-l:#FEF3E2;
  --r:14px; --r2:10px;
  --sh:0 1px 2px rgba(23,35,62,.05), 0 4px 14px rgba(23,35,62,.05);
  --sh2:0 6px 24px rgba(23,35,62,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg); color:var(--tx); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
svg{display:block}
.hide{display:none !important}

/* ---------- 布局 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-ico{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2F6FEB,#57A0F5);display:flex;align-items:center;justify-content:center;flex:none}
.logo-tx b{display:block;font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.25}
.logo-tx span{display:block;font-size:12px;color:var(--tx3);line-height:1.3}
.top-sp{flex:1}
.top-acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--tx2);transition:.15s}
.btn:hover{background:#F7F9FC;border-color:#D6DDEA}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--main);color:#fff;border-color:var(--main)}
.btn.pri:hover{background:var(--main-d);border-color:var(--main-d)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.dgr{color:var(--red);border-color:#F3C9C9;background:#fff}
.btn.dgr:hover{background:var(--red-l)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.blk{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Tab 导航 */
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:63px;z-index:55}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:13px 15px;font-size:15px;font-weight:600;color:var(--tx2);border-bottom:2.5px solid transparent;white-space:nowrap;position:relative}
.tab.on{color:var(--main);border-bottom-color:var(--main)}
.tab .dot{position:absolute;top:9px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}

main{padding:18px 0 30px}
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.card-h h2{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px}
.card-h .sub{font-size:12.5px;color:var(--tx3);font-weight:500}
.card-b{padding:14px 16px}
.card-b.tight{padding:10px 12px}
.sp{flex:1}

.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r2);font-size:13.5px;margin-bottom:14px;line-height:1.5}
.banner.tip{background:var(--amber-l);color:#8A5308;border:1px solid #F6DFB8}
.banner.info{background:var(--main-l);color:#1E4FA8;border:1px solid #CFE0FC}

/* ---------- 今日 ---------- */
.hero{background:linear-gradient(135deg,#2F6FEB 0%,#4F86F0 55%,#6FA3FA 100%);border-radius:var(--r);padding:18px;color:#fff;margin-bottom:14px;box-shadow:0 8px 22px rgba(47,111,235,.22)}
.hero-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero h1{margin:0 0 3px;font-size:19px;font-weight:700}
.hero p{margin:0;font-size:13px;opacity:.9}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
.hs{background:rgba(255,255,255,.16);border-radius:11px;padding:9px 8px;text-align:center;backdrop-filter:blur(4px)}
.hs b{display:block;font-size:20px;font-weight:800;line-height:1.2}
.hs span{display:block;font-size:11.5px;opacity:.88;margin-top:1px}

.todo{display:flex;align-items:flex-start;gap:11px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);margin-bottom:9px;background:#fff;transition:.15s}
.todo:last-child{margin-bottom:0}
.todo.late{border-color:#F5C6C6;background:#FFFBFB}
.todo.done{opacity:.55}
.todo.done .todo-t{text-decoration:line-through}
.todo-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.todo-m{flex:1;min-width:0}
.todo-t{font-size:14.5px;font-weight:600;margin-bottom:2px}
.todo-s{font-size:12.5px;color:var(--tx3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.todo-a{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:700;line-height:1.7}
.pill.late{background:var(--red-l);color:var(--red)}
.pill.today{background:var(--main-l);color:var(--main)}
.pill.yw{background:var(--yw-l);color:var(--yw)}
.pill.sx{background:var(--sx-l);color:var(--sx)}
.pill.yy{background:var(--yy-l);color:var(--yy)}
.pill.yy3{background:var(--yy3-l);color:var(--yy3)}
.pill.ok{background:var(--green-l);color:var(--green)}
.pill.gray{background:#F1F3F8;color:var(--tx3)}

.empty{text-align:center;padding:26px 14px;color:var(--tx3)}
.empty svg{margin:0 auto 8px;opacity:.4}
.empty p{margin:0;font-size:13.5px}

/* ---------- 科目/册次切换 ---------- */
.segs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.seg{padding:8px 15px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--tx2);min-height:40px}
.seg.on{color:#fff;border-color:transparent}
.seg.on[data-s="yw"]{background:var(--yw)}
.seg.on[data-s="sx"]{background:var(--sx)}
.seg.on[data-s="yy"]{background:var(--yy)}
.seg.on[data-s="yy3"]{background:var(--yy3)}
.seg.on.plain{background:var(--main)}

/* 单元卡 */
.unit{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:10px;overflow:hidden;background:#fff}
.unit-h{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
.unit-h:hover{background:#FAFBFD}
.unit-n{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none;color:#fff}
.unit-m{flex:1;min-width:0}
.unit-t{font-size:14.5px;font-weight:600;line-height:1.4}
.unit-f{font-size:12.5px;color:var(--tx3);margin-top:1px}
.unit-r{display:flex;align-items:center;gap:8px;flex:none}
.chev{transition:.2s;color:var(--tx3)}
.unit.open .chev{transform:rotate(180deg)}
.unit-b{display:none;border-top:1px solid var(--line2);padding:12px 14px;background:#FBFCFE}
.unit.open .unit-b{display:block}
.pt{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pt:last-of-type{border-bottom:none}
.pt-chk{width:22px;height:22px;border-radius:6px;border:1.8px solid #C9D2E2;background:#fff;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.15s}
.pt-chk.on{background:var(--green);border-color:var(--green)}
.pt-m{flex:1;min-width:0}
.pt-t{font-size:13px;font-weight:700;color:var(--main);margin-bottom:2px}
.pt-c{font-size:14px;color:var(--tx);line-height:1.75;word-break:break-word}
.unit-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}

.prog{height:6px;border-radius:4px;background:#EDF0F6;overflow:hidden;flex:none;width:56px}
.prog i{display:block;height:100%;border-radius:4px;background:var(--green);transition:width .4s}

/* ---------- 测试 ---------- */
.q{border:1px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:11px;background:#fff}
.q-h{display:flex;gap:9px;margin-bottom:11px}
.q-no{width:26px;height:26px;border-radius:8px;background:var(--main-l);color:var(--main);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.q-t{flex:1;font-size:15.5px;line-height:1.65;font-weight:500;word-break:break-word}
.q-tp{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:#F1F3F8;color:var(--tx3);height:20px;line-height:18px;flex:none}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:15px;line-height:1.55;transition:.13s;min-height:46px;cursor:pointer;background:#fff}
.opt:hover{border-color:#BFD2F5;background:#FAFCFF}
.opt.sel{border-color:var(--main);background:var(--main-l)}
.opt.right{border-color:var(--green);background:var(--green-l)}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.opt-r{width:20px;height:20px;border-radius:50%;border:2px solid #C9D2E2;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.opt.sel .opt-r{border-color:var(--main)}
.opt.sel .opt-r::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--main)}
.opt.right .opt-r{border-color:var(--green)}
.opt.right .opt-r::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--green)}
.opt.wrong .opt-r{border-color:var(--red)}
.opt.wrong .opt-r::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--red)}
.fill-in{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;outline:none;background:#fff;min-height:46px}
.fill-in:focus{border-color:var(--main);background:#FAFCFF}
.jd{display:flex;gap:9px}
.jd .opt{flex:1;justify-content:center;align-items:center;font-weight:600}
.res{margin-top:11px;padding:11px 12px;border-radius:10px;font-size:14px;line-height:1.7}
.res.ok{background:var(--green-l);color:#0A6B36;border:1px solid #BFE6CE}
.res.no{background:var(--red-l);color:#9B1C1C;border:1px solid #F3C9C9}
.res b{font-weight:700}

.score-box{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;text-align:center;padding:6px 0}
.score-tx b{display:block;font-size:32px;font-weight:800;line-height:1.1}
.score-tx span{font-size:13px;color:var(--tx3)}

/* ---------- 错题本 ---------- */
.wr{border:1px solid var(--line);border-radius:var(--r2);padding:13px;margin-bottom:10px;background:#fff}
.wr-h{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.wr-q{font-size:15px;line-height:1.65;font-weight:500;margin-bottom:9px;word-break:break-word}
.wr-o{font-size:13.5px;color:var(--tx2);line-height:1.9;padding-left:2px}
.wr-a{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--line2)}

/* ---------- 报告图表 ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.2}
.stat span{display:block;font-size:12.5px;color:var(--tx3);margin-top:2px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--tx2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.cal-col{display:flex;flex-direction:column;gap:4px}
.cal-d{width:15px;height:15px;border-radius:4px;background:#EDF0F6}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,28,45,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
.modal-h{padding:16px 18px 0;font-size:17px;font-weight:700}
.modal-b{padding:12px 18px;font-size:14.5px;color:var(--tx2);line-height:1.7;overflow-y:auto}
.modal-f{padding:12px 18px 16px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:rgba(28,36,54,.94);color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:88vw;text-align:center}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.fld input,.fld select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;outline:none;background:#fff;min-height:44px}
.fld input:focus,.fld select:focus{border-color:var(--main)}

/* 底部导航（移动端） */
.mnav{display:none}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
  .wrap{padding:0 12px}
  nav.tabs{display:none}
  header.top{position:static}
  .top-in{padding:10px 0}
  .logo-tx b{font-size:16px}
  .top-acts{width:100%}
  .top-acts .btn{flex:1;min-height:42px}
  main{padding:14px 0 20px}
  .card-b{padding:12px 13px}
  .card-h{padding:12px 13px}
  .hero{padding:15px}
  .hero h1{font-size:17px}
  .todo{flex-wrap:wrap}
  .todo-a{width:100%;margin-top:2px}
  .todo-a .btn{flex:1;min-height:40px}
  .grid3{grid-template-columns:1fr 1fr}
  .unit-acts .btn{flex:1;min-width:calc(50% - 4px)}
  .wr-a .btn{flex:1;min-width:calc(50% - 4px)}
  .mnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -2px 14px rgba(23,35,62,.07)
  }
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11px;font-weight:600;color:var(--tx3);position:relative;min-height:56px}
  .mnav button.on{color:var(--main)}
  .mnav .dot{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .score-tx b{font-size:28px}
}
@media (max-width:400px){
  .grid3{grid-template-columns:1fr}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
}
/* ====== 锁屏密码 ====== */
#lockScreen{
  position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#1B2A4E 0%,#2B4178 50%,#3A5A9E 100%);
  display:flex;align-items:center;justify-content:center;padding:24px;
  transition:opacity .4s
}
#lockScreen.hide{opacity:0;pointer-events:none}
.lock-card{
  background:rgba(255,255,255,.97);border-radius:20px;padding:30px 26px;max-width:360px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center
}
.lock-logo{
  width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#2F6FEB,#57A0F5);
  margin:0 auto 16px;display:flex;align-items:center;justify-content:center
}
.lock-card h2{margin:0 0 4px;font-size:19px;font-weight:700;color:#1E2532}
.lock-card .lk-sub{font-size:13px;color:#8A93A6;margin-bottom:22px;line-height:1.5}
.lock-input-grp{position:relative;margin-bottom:14px}
.lock-input-grp svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8A93A6}
.lock-input{
  width:100%;padding:13px 13px 13px 44px;border:2px solid #E6EAF2;border-radius:12px;
  font-size:18px;letter-spacing:6px;text-align:center;outline:none;background:#F9FAFC;
  min-height:50px;font-weight:600;color:#1E2532;transition:.15s
}
.lock-input:focus{border-color:#2F6FEB;background:#fff}
.lock-input::placeholder{letter-spacing:2px;font-weight:400;color:#C2C9D6}
.lock-btn{
  width:100%;padding:14px;border:none;border-radius:12px;background:#2F6FEB;color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;transition:.15s;min-height:50px
}
.lock-btn:active{transform:scale(.97);background:#2358C4}
.lock-btn:disabled{opacity:.5}
.lock-err{color:#DC2626;font-size:13px;margin-top:8px;min-height:18px;line-height:1.4}
.lock-hint{margin-top:16px;font-size:12px;color:#8A93A6;line-height:1.6}
.lock-hint b{color:#5B6577}
.lock-toggle{margin-top:10px;font-size:13px;color:#2F6FEB;cursor:pointer;background:none;border:none;font-weight:600;padding:6px}

/* ====== 打印试卷 A4（紧凑单页版） ====== */
#printArea{display:none}
@media print{
  @page{ size:A4; margin:8mm 10mm }
  body{ background:#fff !important; padding:0 !important; font-size:11pt }
  body *{ visibility:hidden !important }
  #printArea,#printArea *{ visibility:visible !important }
  #printArea{ display:block !important; position:absolute; left:0; top:0; width:100% }
  .pp{ padding:0 0 2mm }
  .pp:last-child{ padding-bottom:0 }
  .pp-h{ text-align:center; border-bottom:1.5px solid #333; padding-bottom:2mm; margin-bottom:2mm }
  .pp-h h1{ font-size:12pt; margin:0 0 0.5mm; font-weight:700 }
  .pp-h .pp-sub{ font-size:8.5pt; color:#555 }
  .pp-info{ display:flex; justify-content:space-between; font-size:8.5pt; margin-bottom:2mm; border:1px solid #999; padding:1mm 2.5mm; border-radius:2px }
  .pp-info span{ display:inline-block; min-width:28% }
  .pp-info b{ font-weight:400 }
  .pp-sec{ margin-bottom:2mm; page-break-inside:auto }
  .pp-sec-h{ font-size:10pt; font-weight:700; margin-bottom:1mm; border-left:2.5px solid #333; padding-left:1.5mm; page-break-after:avoid }
  .pp-py-cell,.pp-kc-i,.pp-bs,.pp-app,.pp-cp,.pp-cw{ page-break-inside:avoid }

/* =================== 新增试卷类型生成器（注入到页面） =================== */
function _gradeOf(sk){ var s = SUBJ[sk]; return (s && s.grade) || '四'; }
function _bookStr(u){ return _gradeOf(u.subject) + '年级' + (u.book === 'up' ? '上册' : '下册'); }

/* —— 日期种子随机（让期中期末试卷每天自动更新，但当天师生版一致） —— */
function _seedFromDate(){
  var s = ymd();
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function _mkRng(seed){
  var st = (seed >>> 0) || 1;
  return function(){
    st = (st + 0x6D2B79F5) >>> 0;
    var t = st;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function _paperSeed(subject, book, type){
  var base = _seedFromDate();
  var s = '' + subject + book + type;
  var h = (base ^ 0x811c9dc5) >>> 0;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function _shuffle(arr, rng){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rng() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* —— 源数据单元定位（按 book+no 位置匹配，规避 id 命名不一致） —— */
function _srcUnitAt(src, u){
  if (!src || !src.units) return null;
  var same = src.units.filter(function(x){ return (x.book || '') === (u.book || ''); })
    .sort(function(a, b){ return (a.no || 0) - (b.no || 0); });
  var bus = UNITS.filter(function(x){ return x.subject === u.subject && x.book === u.book; })
    .sort(function(a, b){ return (a.no || 0) - (b.no || 0); });
  var pos = 0;
  for (var i = 0; i < bus.length; i++){ if (bus[i].id === u.id){ pos = i; break; } }
  return same[pos] || null;
}

/* —— ⑤ 数学乘除法练习（期中期末 · 紧凑 · 大量题目 · 每日随机） —— */
function genCalcMidterm(u, withAns){
  var rng = _mkRng(_paperSeed(u.subject, u.book, 'calc'));
  function ri(a, b){ return a + Math.floor(rng() * (b - a + 1)); }
  var h = _ppOpen('数学乘除法练习（期中期末）', '（' + (withAns ? '教师版' : '学生版') + '）', { subject:'sx', book:u.book });

  /* 一、口算（40 题，4 列网格） */
  var kc = [];
  for (var i = 0; i < 40; i++){
    if (i % 2 === 0){
      var a = ri(11, 99), b = ri(2, 9);
      kc.push({ t: a + ' × ' + b + ' =', a: a * b });
    } else {
      var dv = ri(2, 9), q = ri(11, 99), nd = dv * q;
      kc.push({ t: nd + ' ÷ ' + dv + ' =', a: q });
    }
  }
  h += '<div class="pp-sec"><div class="pp-sec-h">一、口算（40 题，每题 1 分）</div><div class="pp-kc">';
  kc.forEach(function(p){
    h += '<div class="pp-kc-i">' + esc(p.t) + '<span class="pp-kc-b"></span>'
       + (withAns ? '<b class="pp-kc-ans">' + p.a + '</b>' : '') + '</div>';
  });
  h += '</div></div>';

  /* 二、笔算（12 题，留竖式框） */
  var bs = [];
  for (var j = 0; j < 6; j++){
    var m1 = ri(120, 980), m2 = ri(12, 98);
    bs.push({ t: m1 + ' × ' + m2 + ' =', a: m1 * m2 });
  }
  for (var k = 0; k < 6; k++){
    var dv2 = ri(12, 89), q2 = ri(3, 12), rm = ri(0, dv2 - 1), nd2 = dv2 * q2 + rm;
    bs.push({ t: nd2 + ' ÷ ' + dv2 + ' =', a: q2 + ' 余 ' + rm });
  }
  h += '<div class="pp-sec"><div class="pp-sec-h">二、用竖式计算（12 题，每题 3 分）</div>';
  bs.forEach(function(p, idx){
    h += '<div class="pp-bs"><div class="pp-bs-t">' + (idx+1) + '. ' + esc(p.t) + '</div><div class="pp-calc-box"></div>'
       + (withAns ? '<div class="pp-bs-ans">= ' + esc(p.a) + '</div>' : '') + '</div>';
  });
  h += '</div>';

  /* 三、估算（12 题） */
  var est = [];
  for (var e = 0; e < 12; e++){
    var a3 = ri(100, 999), b3 = ri(10, 99);
    est.push({ t: a3 + ' × ' + b3 + ' ≈ ？', a: '≈ ' + (Math.round(a3/100)*100) + '×' + (Math.round(b3/10)*10) + '=' + (Math.round(a3/100)*100)*(Math.round(b3/10)*10) });
  }
  h += '<div class="pp-sec"><div class="pp-sec-h">三、估算（12 题，每题 2 分）</div><div class="pp-py-grid">';
  est.forEach(function(p, i){
    h += '<div class="pp-py-cell"><div class="pp-py-py" style="font-size:10.5pt">' + (i+1) + '. ' + esc(p.t) + '</div><div class="pp-py-blank"></div>'
       + (withAns ? '<div class="pp-py-ans">' + esc(p.a) + '</div>' : '') + '</div>';
  });
  h += '</div></div>';

  /* 四、应用题（12 题，留答题区） */
  var templates = [
    function(){ var p=ri(15,45), s=ri(20,150); return ['水果店运来 '+p+' 箱苹果，每箱 '+s+' 个，一共有多少个苹果？', p+' × '+s+' = '+(p*s)+'（个）']; },
    function(){ var t=ri(120,300), c=ri(4,9); return ['同学们收集了 '+t+' 节废电池，平均分给 '+c+' 个环保小组，每个小组分到多少节？', t+' ÷ '+c+' = '+(t/c)+'（节）']; },
    function(){ var s=ri(60,100), d=ri(3,8); return ['一辆汽车每小时行驶 '+s+' 千米，'+d+' 小时行驶多少千米？', s+' × '+d+' = '+(s*d)+'（千米）']; },
    function(){ var p=ri(150,300), r=ri(5,9); return ['学校买了 '+p+' 本新书，平均分给 '+r+' 个班，每班分到多少本？', p+' ÷ '+r+' = '+(p/r)+'（本）']; },
    function(){ var a=ri(8,16), s=ri(50,120); return ['一套书 '+a+' 本，每本 '+s+' 页，一共有多少页？', a+' × '+s+' = '+(a*s)+'（页）']; },
    function(){ var a=ri(200,500), w=ri(40,90); return ['一辆卡车每次运货 '+w+' 箱，'+a+' 箱货物需要运多少次？', a+' ÷ '+w+' = '+(a/w)+'（次）']; },
    function(){ var d=ri(200,600), p=ri(3,7); return ['图书馆有 '+d+' 本书，平均放在 '+p+' 个书架上，每个书架放多少本？', d+' ÷ '+p+' = '+(d/p)+'（本）']; },
    function(){ var s=ri(40,90), d=ri(5,12); return ['小明每天练字 '+d+' 张，'+s+' 天一共可以练多少张？', d+' × '+s+' = '+(d*s)+'（张）']; },
    function(){ var t=ri(180,360), n=ri(20,50); return ['工厂生产了 '+t+' 个零件，每箱装 '+n+' 个，需要多少个箱子？', t+' ÷ '+n+' = '+(t/n)+'（箱）']; },
    function(){ var a=ri(25,80), b=ri(3,9); return ['食堂每天用大米 '+a+' 千克，'+b+' 天共用多少千克？', a+' × '+b+' = '+(a*b)+'（千克）']; }
  ];
  var apps = [];
  var tIdx = _shuffle(templates.map(function(_, i){ return i; }), rng);
  for (var t = 0; t < 12; t++){
    var tmpl = templates[tIdx[t % tIdx.length]];
    var r2 = tmpl();
    apps.push({ q: r2[0], a: r2[1] });
  }
  h += '<div class="pp-sec"><div class="pp-sec-h">四、解决问题（12 题，每题 4 分。先列式，再计算）</div>';
  apps.forEach(function(p, idx){
    h += '<div class="pp-app"><div class="pp-app-q">' + (idx+1) + '. ' + esc(p.q) + '</div>'
       + '<div class="pp-calc-box tall"></div>'
       + (withAns ? '<div class="pp-bs-ans">' + esc(p.a) + '</div>' : '') + '</div>';
  });
  h += '</div>';
  h += '<div style="margin-top:6px;font-size:9pt;color:#888">※ 应用题请先列出算式，再计算作答。</div>';
  return h + _ppClose();
}

function unitsOf(sk, book){ return UNITS.filter(function(u){ return u.subject===sk && u.book===book; }).sort(function(a,b){return a.no-b.no;}); }
function qsOfUnit(uid){ return QS.filter(function(q){ return q.u===uid; }); }

/* ---------- 工具 ---------- */
function ymd(d){ d = d||new Date(); var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
function addDays(dateStr, n){ var p=dateStr.split('-'); var d=new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate()+n); return ymd(d); }
function dayGap(a, b){ var pa=a.split('-'), pb=b.split('-'); var da=new Date(+pa[0],+pa[1]-1,+pa[2]), db=new Date(+pb[0],+pb[1]-1,+pb[2]); return Math.round((db-da)/86400000); }
function cnDate(s){ var p=s.split('-'); return (+p[1])+'月'+(+p[2])+'日'; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function norm(s){
  return String(s==null?'':s)
    .replace(/[\uFF01-\uFF5E]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); })
    .replace(/\u3000/g,'')
    .replace(/\s+/g,'')
    .replace(/[，。、；：？！""''‘’“”（）【】《》〈〉·,.;:?!"'()\[\]<>~`_—\-]/g,'')
    .replace(/[≈=]/g,'')
    .toLowerCase();
}
function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }

function seed(){
  var t = ymd();
  var firstOf = function(sk){ var a = unitsOf(sk,'up'); return a.length ? a[0] : null; };
  var yw1 = firstOf('yw'), sx1 = firstOf('sx'), yy1 = firstOf('yy');

  if (yw1) S.tasks.push({ id:uid(), date:addDays(t,-2), subject:'yw', unitId:yw1.id, type:'learn', title:'预习 '+yw1.name, done:false, demo:true });
  if (sx1) S.tasks.push({ id:uid(), date:t, subject:'sx', unitId:sx1.id, type:'test', title:'完成 '+sx1.name+' 单元小测', done:false, demo:true });
  if (yy1) S.tasks.push({ id:uid(), date:t, subject:'yy', unitId:yy1.id, type:'learn', title:'背诵 '+yy1.name+' 核心单词', done:false, demo:true });
  if (yw1) S.tasks.push({ id:uid(), date:addDays(t,1), subject:'yw', unitId:yw1.id, type:'test', title:'完成 '+yw1.name+' 单元小测', done:false, demo:true });

  if (sx1) {
    S.units[sx1.id] = { status:'learning', pts:{0:true,1:true} };
    var qq = qsOfUnit(sx1.id);
    if (qq.length >= 4) {
      S.exams.push({
        id:uid(), date:addDays(t,-3), subject:'sx', unitId:sx1.id, unitName:sx1.name,
        total:qq.length, right:Math.max(1,qq.length-2), rate:Math.round((qq.length-2)/qq.length*100),
        items:[], demo:true
      });
      var w = qq[qq.length-1];
      S.wrong.push({ qid:w.id, subject:'sx', unitId:sx1.id, ua:'', addDate:addDays(t,-3), lastDate:addDays(t,-3), times:0, mastered:false, demo:true });
    }
  }
  if (yw1) {
    var qw = qsOfUnit(yw1.id);
    if (qw.length) S.wrong.push({ qid:qw[0].id, subject:'yw', unitId:yw1.id, ua:'', addDate:addDays(t,-1), lastDate:addDays(t,-1), times:0, mastered:false, demo:true });
  }
  S.checkin[addDays(t,-3)] = 1; S.checkin[addDays(t,-2)] = 2; S.checkin[addDays(t,-5)] = 1;
}

/* ---------- 单元进度 ---------- */
function uState(uid_){ var o = S.units[uid_]; return o || { status:'todo', pts:{} }; }
function uPct(u){
  var st = uState(u.id);
  if (st.status === 'done') return 100;
  var n = u.points.length || 1, c = 0;
  for (var k in st.pts) if (st.pts[k]) c++;
  return Math.round(clamp(c,0,n)/n*100);
}
function unitBest(uid_){
  var best = null;
  S.exams.forEach(function(e){ if (e.unitId===uid_ && (!best || e.rate>best)) best = e.rate; });
  return best;
}
function doneUnits(sk){
  return UNITS.filter(function(u){ return (!sk || u.subject===sk) && uState(u.id).status==='done'; }).length;
}

/* ---------- 今日事项 ---------- */
function todayItems(){
  var t = ymd(), out = [];
  S.tasks.forEach(function(x){
    if (x.done) return;
    if (x.date > t) return;
    var late = dayGap(x.date, t);
    out.push({ kind:'task', late:late, data:x, sort:(late>0?0:1) });
  });
  S.wrong.forEach(function(w){
    if (w.mastered) return;
    if (dayGap(w.lastDate||w.addDate, t) < 2) return;
    out.push({ kind:'review', late:0, data:w, sort:2 });
  });
  out.sort(function(a,b){ return a.sort-b.sort || b.late-a.late; });
  return out;
}
function pendingCount(){ return todayItems().length; }
function wrongPending(){ return S.wrong.filter(function(w){ return !w.mastered; }).length; }

/* 环形进度 SVG */
function ring(pct, color, size){
  size = size || 70;
  var r = size/2 - 6, c = 2*Math.PI*r, off = c*(1-pct/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#EDF0F6" stroke-width="7"/>'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round"'
    + ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'
    + '<text x="'+size/2+'" y="'+(size/2+5)+'" text-anchor="middle" font-size="'+(size*0.26).toFixed(0)+'" font-weight="800" fill="'+color+'" font-family="-apple-system,sans-serif">'+pct+'%</text></svg>';
}

/* 题目作答区（复用于测试和错题重做） */
function qBody(q, ua, showAns, cbName){
  var h = '';
  if (q.type === 'choice') {
    (q.o||[]).forEach(function(op, oi){
      var cls = 'opt';
      if (showAns) { if (oi===q.a) cls+=' right'; else if (ua===oi) cls+=' wrong'; }
      else if (ua===oi) cls+=' sel';
      h += '<div class="'+cls+'" onclick="'+(showAns?'':cbName+'(\''+q.id+'\','+oi+')')+'"><div class="opt-r"></div><div>'+esc(op)+'</div></div>';
    });
  } else if (q.type === 'judge') {
    h += '<div class="jd">';
    [[true,'✓ 对'],[false,'✗ 错']].forEach(function(p){
      var cls='opt';
      if (showAns){ if (p[0]===q.a) cls+=' right'; else if (ua===p[0]) cls+=' wrong'; }
      else if (ua===p[0]) cls+=' sel';
      h += '<div class="'+cls+'" onclick="'+(showAns?'':cbName+'(\''+q.id+'\','+p[0]+')')+'"><div class="opt-r"></div><div>'+p[1]+'</div></div>';
    });
    h += '</div>';
  } else {
    h += '<input class="fill-in" type="text" placeholder="在这里写答案" value="'+esc(ua==null?'':ua)+'"'
       + (showAns?' disabled':'')+' oninput="'+cbName+'(\''+q.id+'\',this.value)">';
  }
  return h;
}
function judge(q, ua){
  if (ua===undefined || ua===null || ua==='') return false;
  if (q.type==='choice') return ua===q.a;
  if (q.type==='judge') return ua===q.a;
  var accept = String(q.a).split('|').map(norm);
  return accept.indexOf(norm(ua)) >= 0;
}
function ansText(q){
  if (q.type==='choice') return (q.o&&q.o[q.a])?q.o[q.a]:'—';
  if (q.type==='judge') return q.a?'对':'错';
  return String(q.a).split('|')[0];
}

  else if (pType === 'calc' && u.subject === 'sx') paperHTML = genCalcPaper(u, withAns);
  else if (pType === 'copy' && (u.subject === 'yy' || u.subject === 'yy3')) paperHTML = genCopyPaper(u, withAns);
  else if (pType === 'word' && (u.subject === 'yy' || u.subject === 'yy3')) paperHTML = genWordTest(u, withAns);
  else if (pType === 'phrase' && (u.subject === 'yy' || u.subject === 'yy3')) paperHTML = genPhraseTest(u, withAns);
  else if (pType === 'charcheck' && u.subject === 'yw') paperHTML = genCharTest(u, withAns);
  else if (pType === 'calcmid' && u.subject === 'sx') paperHTML = genCalcMidterm(u, withAns);
  else {
    var qs = qsOfUnit(uid_);
    if (!qs.length) { toast('这个单元没有题目，可换其他试卷类型'); return; }
    paperHTML = generatePaper(u, qs, withAns);
  }
  closeModal();
  var pa = document.getElementById('printArea');
  pa.innerHTML = paperHTML;
  setTimeout(function(){ window.print(); setTimeout(function(){ pa.innerHTML = ''; }, 500); }, 200);
}

function generatePaper(u, qs, withAns){
  var sj = SUBJ[u.subject]||SUBJ.yw;
  var bookStr = _gradeOf(u.subject)+'年级'+(u.book==='up'?'上册':'下册'); /*__B2_GRADE__*/
  var verStr = withAns ? '（教师版·含答案）' : '（学生版）';
  var dateStr = (function(){ var d=new Date(); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'; })();

  // 按题型分组
  var choices = qs.filter(function(q){return q.type==='choice';});
  var judges  = qs.filter(function(q){return q.type==='judge';});
  var fills   = qs.filter(function(q){return q.type==='fill';});

  var h = '';
  // 单页试卷（不分页）
  h += '<div class="pp"><div class="pp-h">';
  h += '<h1>'+esc(bookStr)+' '+esc(sj.name)+' '+esc(u.name.replace(/^第[一二三四五六七八九十]+单元\s*/,''))+'</h1>';
  h += '<div class="pp-sub">'+esc(sj.name)+'单元测试卷 '+verStr+'  '+dateStr+'</div>';
  h += '</div>';
  h += '<div class="pp-info"><span>姓名：<b>　　</b></span><span>班级：<b>　　</b></span><span>得分：<b>　　</b></span></div>';

  var secIdx = 0;
  // 一、选择题 — 选项内联一行
  if (choices.length) {
    secIdx++;
    h += '<div class="pp-sec"><div class="pp-sec-h">'+cnNum(secIdx)+'、选择题（共'+choices.length+'题，每题'+Math.round(100/qs.length)+'分）</div>';
    choices.forEach(function(q, i){
      h += '<div class="pp-q"><span class="pp-q-n">'+(i+1)+'.</span>'+esc(q.q).replace(/_{2,}/g,'<span class="pp-fill-line"></span>')+'</div>';
      h += '<div class="pp-opts-inline">';
      (q.o||[]).forEach(function(op, oi){
        var letter = String.fromCharCode(65+oi);
        h += '<span class="pp-opt-inline">'+letter+'. '+esc(op.replace(/^[A-D]\.\s*/,''))+'</span>';
      });
      h += '</div>';
      if (withAns) h += '<div class="pp-ans-inline"><b>【'+String.fromCharCode(65+q.a)+'】</b> '+esc(q.ex)+'</div>';
    });
    h += '</div>';
  }
  // 二、判断题
  if (judges.length) {
    secIdx++;
    h += '<div class="pp-sec"><div class="pp-sec-h">'+cnNum(secIdx)+'、判断题（共'+judges.length+'题，对的打 ✓，错的打 ✗）</div>';
    judges.forEach(function(q, i){
      h += '<div class="pp-q"><span class="pp-q-n">'+(i+1)+'.</span>'+esc(q.q).replace(/_{2,}/g,'<span class="pp-fill-line"></span>')+'<span class="pp-judge-box">　</span></div>';
      if (withAns) h += '<div class="pp-ans-inline"><b>【'+(q.a?'✓':'✗')+'】</b> '+esc(q.ex)+'</div>';
    });
    h += '</div>';
  }
  // 三、填空题
  if (fills.length) {
    secIdx++;
    h += '<div class="pp-sec"><div class="pp-sec-h">'+cnNum(secIdx)+'、填空题（共'+fills.length+'题，将答案写在横线上）</div>';
    fills.forEach(function(q, i){
      var qText = esc(q.q).replace(/_{2,}/g,'<span class="pp-fill-line"></span>');
      h += '<div class="pp-q"><span class="pp-q-n">'+(i+1)+'.</span>'+qText+'</div>';
      if (withAns) h += '<div class="pp-ans-inline"><b>【'+esc(String(q.a).split('|')[0])+'】</b> '+esc(q.ex)+'</div>';
    });
    h += '</div>';
  }

  /* ===== 数学单元自动补充：题量不足时生成额外题目填满页面 ===== */
  if (u.subject === 'sx' && choices.length + judges.length + fills.length < 28) {
    var needChoice = Math.max(0, 8 - choices.length);
    var needJudge  = Math.max(0, 8 - judges.length);
    var needFill   = Math.max(0, 12 - fills.length);

    /* 补充选择题 */
    if (needChoice > 0) {
      if (!choices.length) { secIdx++; h += '<div class="pp-sec"><div class="pp-sec-h">'+cnNum(secIdx)+'、选择题（共'+needChoice+'题，每题 4 分）</div>'; }
      var extraC = [
        {q:'下面各数中，最大的数是（ ）。',o:['A. 99999999','B. 100000000','C. 99990000','D. 10000000'],a:1,ex:'100000000＝一亿，最大。'},
        {q:'一个数的近似数是8万，这个数最大是（ ）。',o:['A. 74999','B. 79999','C. 84999','D. 80001'],a:2,ex:'四舍五入到万位看千位，84999千位4≤4舍去得8万，最大。'},
        {q:'最小的自然数是（ ）。',o:['A. 0','B. 1','C. -1','D. 没有最小的'],a:0,ex:'自然数从0开始。'},
        {q:'把整万数改写成用"万"作单位的数时（ ）。',o:['A. 去掉末尾4个0','B. 去掉末尾4个数','C. 除以10000','D. 加上"万"字'],a:0,ex:'去掉末尾4个0再写"万"。'},
        {q:'0除以任何不是0的数都得（ ）。',o:['A. 0','B. 1','C. 不确定','D. 原数'],a:0,ex:'0除以非零数商为0。'},
        {q:'在乘法算式中，一个因数不变，另一个因数扩大10倍，积（ ）。',o:['A. 不变','B. 扩大10倍','C. 缩小10倍','D. 无法确定'],a:1,ex:'积随因数同倍变化。'},
        {q:'计算 125×8 时，最简便的方法是（ ）。',o:['A. 竖式计算','B. 125×2×4','C. 125×4×2','D. 100×8+25×8'],a:3,ex:'100×8+25×8=800+200=1000，最简便。'},
        {q:'下面算式中，结果最大的是（ ）。',o:['A. 360÷9','B. 240÷6','C. 400÷8','D. 180÷3'],a:3,ex:'180÷3=60，结果最大。'}
      ];
      for (var ci = 0; ci < needChoice; ci++) {
        var ec = extraC[ci % extraC.length];
        var baseIdx = choices.length + ci + 1;
        h += '<div class="pp-q"><span class="pp-q-n">'+baseIdx+'.</span>'+esc(ec.q)+'</div>';
        h += '<div class="pp-opts-inline">';
        (ec.o||[]).forEach(function(op, oi){ var letter = String.fromCharCode(65+oi); h += '<span class="pp-opt-inline">'+letter+'. '+esc(op)+'</span>'; });
        h += '</div>';
        if (withAns) h += '<div class="pp-ans-inline"><b>【'+String.fromCharCode(65+ec.a)+'】</b> '+esc(ec.ex)+'</div>';
      }
      if (!choices.length) h += '</div>';
    }
    /* 补充判断题 */
    if (needJudge > 0) {
      if (!judges.length) { secIdx++; h += '<div class="pp-sec"><div class="pp-sec-h">'+cnNum(secIdx)+'、判断题（共'+needJudge+'题，对的打 ✓，错的打 ✗）</div>'; }
      var extraJ = [
        {q:'两个因数的积一定大于其中任何一个因数。',a:false,ex:'如 1×0=0，积小于因数。'},
        {q:'0乘任何数都等于0。',a:true,ex:'0乘法性质。'},
        {q:'除以一个不为0的数等于乘这个数的倒数。',a:true,ex:'除法与乘法的互逆关系。'},
        {q:'三位数除以两位数，商一定是两位数。',a:false,ex:'如 100÷25=4 商是一位数。'},
        {q:'估算的结果比精确计算的结果更准确。',a:false,ex:'估算只是近似值。'},
        {q:'在有余数的除法中，余数一定要比除数小。',a:true,ex:'余数的基本性质。'},
        {q:'一个数的近似数可能比原数大也可能比原数小。',a:true,ex:'四舍变小，五入变大。'},
        {q:'所有的偶数都是合数。',a:false,ex:'2是偶数但不是合数。'}
      ];
      for (var ji = 0; ji < needJudge; ji++) {
        var ej = extraJ[ji % extraJ.length];
        var baseIdx2 = judges.length + ji + 1;
        h += '<div class="pp-q"><span class="pp-q-n">'+baseIdx2+'.</span>'+esc(ej.q)+'<span class="pp-judge-box">　</span></div>';
        if (withAns) h += '<div class="pp-ans-inline"><b>【'+(ej.a?'✓':'✗')+'】</b> '+esc(ej.ex)+'</div>';
      }
      if (!judges.length) h += '</div>';
    }
    /* 补充填空题 */
    if (needFill > 0) {
      if (!fills.length) { secIdx++; h += '<div class="pp-sec"><div class="pp-sec-h">'+cnNum(secIdx)+'、填空题（共'+needFill+'题，将答案写在横线上）</div>'; }
      var extraF = [
        {q:'由5个亿、608个万和30个一组成的数是 ______。',a:'50608030',ex:'按数位组合。'},
        {q:'把 420000 改写成用"万"作单位的数是 ______ 万。',a:'42',ex:'去掉末尾4个0。'},
        {q:'386420 省略万位后面的尾数约是 ______ 万。',a:'39',ex:'千位6≥5进1。'},
        {q:'7800000000 改写成用"亿"作单位是 ______ 亿。',a:'78',ex:'去掉末尾8个0。'},
        {q:'写出下面各数：二亿六千六百七十五万 读作 ______。',a:'266750000',ex:'中文数字转阿拉伯数字。'},
        {q:'写出下面各数：34781034 读作 ______。',a:'三千四百七十八万一千零三十四',ex:'分级读数。'},
        {q:'比较大小：65373033 ______ 65335212（填＞、＜或＝）。',a:'>',ex:'逐位比较。'},
        {q:'23435212 读作 ______。',a:'二千三百四十三万五千二百一十二',ex:'四位一级读数。'},
        {q:'37854415 读作 ______。',a:'三千七百八十五万四千四百一十五',ex:'先分级再读。'},
        {q:'97565069 读作 ______。',a:'九千七百五十六万五千零六十九',ex:'注意中间的0要读。'},
        {q:'把 350000 改写成用"万"作单位的数是 ______。',a:'35',ex:'简单改写。'},
        {q:'900000000 改成用"亿"作单位是 ______ 亿。',a:'9',ex:'九亿。'}
      ];
      for (var fi = 0; fi < needFill; fi++) {
        var ef = extraF[fi % extraF.length];
        var baseIdx3 = fills.length + fi + 1;
        var qText2 = esc(ef.q).replace(/_{2,}/g,'<span class="pp-fill-line"></span>');
        h += '<div class="pp-q"><span class="pp-q-n">'+baseIdx3+'.</span>'+qText2+'</div>';
        if (withAns) h += '<div class="pp-ans-inline"><b>【'+esc(ef.a.split('|')[0])+'】</b> '+esc(ef.ex)+'</div>';
      }
      if (!fills.length) h += '</div>';
    }
  }

  h += '</div>';
  return h;
}


function cnNum(n){

}

function lineChart(ex){
  if (!ex.length) return '<div class="empty">'+svg(ICON.report,36,1.6)+'<p>还没有测试数据</p></div>';
  var W=640, H=200, PL=38, PR=14, PT=16, PB=30;
  var iw = W-PL-PR, ih = H-PT-PB;
  var n = ex.length;
  var x = function(i){ return PL + (n===1 ? iw/2 : iw*i/(n-1)); };
  var y = function(v){ return PT + ih*(1 - v/100); };
  var g = '';
  [0,25,50,75,100].forEach(function(v){
    g += '<line x1="'+PL+'" y1="'+y(v)+'" x2="'+(W-PR)+'" y2="'+y(v)+'" stroke="#EDF0F6" stroke-width="1"/>'
       + '<text x="'+(PL-7)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="#8A93A6">'+v+'</text>';
  });
  g += '<line x1="'+PL+'" y1="'+y(85)+'" x2="'+(W-PR)+'" y2="'+y(85)+'" stroke="#12A150" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>';
  var pts = ex.map(function(e,i){ return x(i)+','+y(e.rate); }).join(' ');
  var area = PL+','+(PT+ih)+' '+pts+' '+x(n-1)+','+(PT+ih);
  g += '<polygon points="'+area+'" fill="#2F6FEB" opacity=".08"/>';
  g += '<polyline points="'+pts+'" fill="none" stroke="#2F6FEB" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  ex.forEach(function(e,i){
    var c = e.rate>=85?'#12A150':e.rate>=60?'#D97706':'#DC2626';
    g += '<circle cx="'+x(i)+'" cy="'+y(e.rate)+'" r="4.5" fill="#fff" stroke="'+c+'" stroke-width="2.4"/>';
    g += '<text x="'+x(i)+'" y="'+(y(e.rate)-10)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="'+c+'">'+e.rate+'</text>';
    if (n<=8 || i%2===0) g += '<text x="'+x(i)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" fill="#8A93A6">'+cnDate(e.date)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" font-family="-apple-system,sans-serif">'+g+'</svg>'
       + '<div class="legend"><span><i style="background:#2F6FEB"></i>每次测试正确率</span><span><i style="background:#12A150"></i>85% 优秀线</span></div>';
}

function barChart(){
  var data = SUBJ_ORDER.map(function(sk){
    return { sk:sk, todo:S.wrong.filter(function(w){return w.subject===sk && !w.mastered && QMAP[w.qid];}).length,
             done:S.wrong.filter(function(w){return w.subject===sk && w.mastered && QMAP[w.qid];}).length };
  });
  var max = Math.max(1, Math.max.apply(null, data.map(function(d){ return d.todo+d.done; })));
  if (max===1 && data.every(function(d){return d.todo+d.done===0;})) return '<div class="empty">'+svg(ICON.wrong,36,1.6)+'<p>还没有错题记录，继续保持</p></div>';
  var W=640,H=190,PL=34,PB=30,PT=14;
  var ih=H-PT-PB, bw=68, gap=(W-PL-24-bw*3)/2;
  var g='';
  [0,max/2,max].forEach(function(v){
    var yy = PT+ih*(1-v/max);
    g += '<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-14)+'" y2="'+yy+'" stroke="#EDF0F6"/>'
       + '<text x="'+(PL-7)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#8A93A6">'+Math.round(v)+'</text>';
  });
  data.forEach(function(d,i){
    var bx = PL+14+i*(bw+gap);
    var ht = ih*d.todo/max, hd = ih*d.done/max;
    var yTop = PT+ih-ht-hd;
    if (hd>0) g += '<rect x="'+bx+'" y="'+(PT+ih-hd)+'" width="'+bw+'" height="'+hd+'" fill="#C9D2E2" rx="3"/>';
    if (ht>0) g += '<rect x="'+bx+'" y="'+(PT+ih-hd-ht)+'" width="'+bw+'" height="'+ht+'" fill="'+SUBJ[d.sk].color+'" rx="3"/>';
    g += '<text x="'+(bx+bw/2)+'" y="'+(yTop-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="'+SUBJ[d.sk].color+'">'+(d.todo+d.done||'')+'</text>';
    g += '<text x="'+(bx+bw/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="12" fill="#5B6577">'+SUBJ[d.sk].name+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" font-family="-apple-system,sans-serif">'+g+'</svg>'
       + '<div class="legend"><span><i style="background:#2F6FEB"></i>待攻克</span><span><i style="background:#C9D2E2"></i>已掌握</span></div>';
}

function heatmap(){
  var t = ymd(), cols = [];
  var todayDow = new Date().getDay();
  var end = addDays(t, 6-todayDow);
  for (var w=4; w>=0; w--) {
    var col = [];
    for (var d=6; d>=0; d--) col.unshift(addDays(end, -(w*7+d)));
    cols.push(col);
  }
  var h = '<div class="cal">';
  cols.forEach(function(col){
    h += '<div class="cal-col">';
    col.forEach(function(day){
      var v = S.checkin[day]||0;
      var bg = v>=3?'#12A150':v===2?'#4EC57F':v===1?'#A8E3C0':'#EDF0F6';
      var bd = day===t?';box-shadow:0 0 0 2px #2F6FEB':'';
      h += '<div class="cal-d" style="background:'+bg+bd+'" title="'+day+(v?'（'+v+'次学习）':'')+'"></div>';
    });
    h += '</div>';
  });
  h += '</div><div class="legend"><span><i style="background:#EDF0F6"></i>没学</span><span><i style="background:#A8E3C0"></i>学了1次</span><span><i style="background:#4EC57F"></i>2次</span><span><i style="background:#12A150"></i>3次以上</span></div>';
  return h;
}

/* ---------- 删除标记（tombstone）：保证删除项在任何云端恢复后都不会回来 ---------- */
function markDeleted(kind, id){ try { if(!S.del[kind]) S.del[kind]={}; S.del[kind][id] = ymd(); } catch(e){} }
function purgeDeleted(){
  if (!S.del) return;
  ['tasks','wrong','exams'].forEach(function(k){
    var d = S.del[k]||{};
    if (k==='tasks') S.tasks = S.tasks.filter(function(x){ return !d[x.id]; });
    else if (k==='wrong') S.wrong = S.wrong.filter(function(x){ return !d[x.qid]; });
    else if (k==='exams') S.exams = S.exams.filter(function(x){ return !d[x.id]; });
  });
}
function mergeDel(a, b){
  var o = { tasks:{}, wrong:{}, exams:{} };
  [a,b].forEach(function(x){
    if (!x) return;
    ['tasks','wrong','exams'].forEach(function(k){
      if (x[k]) for (var id in x[k]) if (Object.prototype.hasOwnProperty.call(x[k], id)) o[k][id] = x[k][id];
    });
  });
  return o;
}

function autoPlan(){

                    .sort(function(a,b){ return (a.book===b.book?0:(a.book==='up'?-1:1)) || a.no-b.no; })[0];

function setTest(sk, book, uid_){
  if (sk){ TV.sk=sk; TV.unitId=''; } if (book){ TV.book=book; TV.unitId=''; } if (uid_) TV.unitId=uid_;
  viewTest();
}
function startTest(uid_, taskId){
  var u = UMAP[uid_]; if(!u) return;
  var qs = qsOfUnit(uid_);
  if (!qs.length) { toast('这个单元还没有配题'); return; }
  TV.running = { name:u.name+' · 单元测试', qs:qs, unitId:uid_, subject:u.subject, taskId:taskId||null, mix:false };
  TV.answers = {}; TV.submitted = false; TV.result = null;
  go('test');
}
function startMix(){
  var pool = QS.slice(), pick = [];
  for (var i=0; i<15 && pool.length; i++) pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  if (!pick.length) { toast('题库为空'); return; }
  TV.running = { name:'随机综合测 · 三科混合', qs:pick, unitId:'', subject:'', taskId:null, mix:true };
  TV.answers = {}; TV.submitted = false; TV.result = null;
  go('test');
}
function pick(qid, val){ TV.answers[qid] = val; if (!TV.submitted) renderPaper(); }
function quitPaper(){ TV.running=null; TV.submitted=false; TV.result=null; TV.answers={}; go('test'); }
function submitPaper(){
  var R = TV.running; if(!R) return;
  var un = R.qs.filter(function(q){ var a=TV.answers[q.id]; return a===undefined||a===null||a===''; }).length;
  if (un > 0) {
    modal('还有 '+un+' 题没做', '<p>没做的题会算作答错，确定现在交卷吗？</p>',
      '<button class="btn" onclick="App.closeModal()">再检查一下</button><button class="btn pri" onclick="App.closeModal();App.doSubmit()">确定交卷</button>');
    return;
  }
  doSubmit();
}
function doSubmit(){
  var R = TV.running, t = ymd(), right = 0, wrongIds = [], items = [];
  R.qs.forEach(function(q){
    var ua = TV.answers[q.id], ok = judge(q, ua);
    if (ok) right++; else wrongIds.push(q.id);
    items.push({ qid:q.id, ok:ok });
    // 错题本维护
    var ex = S.wrong.filter(function(w){ return w.qid===q.id; })[0];
    if (!ok) {
      if (ex) { ex.lastDate=t; ex.mastered=false; ex.ua=String(ua==null?'':ua); }
      else S.wrong.push({ qid:q.id, subject:q.subject, unitId:q.u, ua:String(ua==null?'':ua), addDate:t, lastDate:t, times:0, mastered:false });
    } else if (ex && !ex.mastered) {
      ex.times = (ex.times||0)+1; ex.lastDate = t;
      if (ex.times>=2) ex.mastered = true;
    }
  });
  var rate = Math.round(right/R.qs.length*100);
  S.exams.push({ id:uid(), date:t, subject:R.mix?'sx':R.subject, unitId:R.unitId, unitName:R.name,
                 total:R.qs.length, right:right, rate:rate, items:items });
  if (R.taskId) { var tk = S.tasks.filter(function(x){return x.id===R.taskId;})[0]; if(tk){ tk.done=true; tk.doneDate=t; } }
  else if (R.unitId) S.tasks.forEach(function(x){ if(x.unitId===R.unitId && x.type==='test' && !x.done){ x.done=true; x.doneDate=t; } });
  if (R.unitId && rate>=85) { var st = S.units[R.unitId]||{status:'todo',pts:{}}; if(st.status!=='done'){ st.status='learning'; } S.units[R.unitId]=st; }
  checkin();
  TV.submitted = true;
  TV.result = { right:right, total:R.qs.length, rate:rate, wrongIds:wrongIds };
  save(); renderNav(); renderPaper();
  window.scrollTo({ top:0, behavior:'smooth' });
}

  var q = QMAP[RD.qid]; if(!q) return;
  var ok = judge(q, RD.ua);
  var w = S.wrong.filter(function(a){return a.qid===RD.qid;})[0];

    else { w.times = 0; w.mastered = false; w.ua = String(RD.ua==null?'':RD.ua); }
  }
  checkin(); save(); renderRedo(true); renderNav();
  if (ok && w && w.mastered) setTimeout(function(){ toast('连续答对 2 次，这题已掌握！'); }, 350);

function importJSON(input){
  var f = input.files && input.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var o = JSON.parse(r.result);
      var st = o.state || o;
      if (!st || typeof st !== 'object' || (!st.units && !st.exams && !st.tasks)) throw new Error('格式不对');
      var cnt = (st.exams||[]).length + (st.wrong||[]).length + (st.tasks||[]).length;
      modal('确认导入', '<p>这份备份包含 <b>'+cnt+'</b> 条记录、<b>'+Object.keys(st.units||{}).length+'</b> 个单元进度。</p>'

        '<button class="btn" onclick="App.closeModal()">取消</button><button class="btn pri" onclick="App.doImport()">确定导入</button>');
      window.__pendingImport = st;
    } catch(e){ toast('导入失败：文件格式不正确'); }
    input.value = '';
  };
  r.readAsText(f);
}
function doImport(){
  var st = window.__pendingImport; if(!st) return;
  var localDel = (S && S.del) ? S.del : { tasks:{}, wrong:{}, exams:{} };
  S = Object.assign(blank(), st); S.seeded = true;
  S.del = mergeDel(S.del, localDel);   // 合并本机删除标记，已删项不再回来
  purgeDeleted();
  save(); closeModal(); go('today'); toast('导入成功，数据已恢复');
  window.__pendingImport = null;
}
function exportCSV(){
  if (!S.exams.length) { toast('还没有测试记录'); return; }
  var rows = [['日期','科目','单元','总题数','答对','正确率(%)']];
  S.exams.forEach(function(e){
    rows.push([e.date, (SUBJ[e.subject]||{name:'—'}).name, e.unitName, e.total, e.right, e.rate]);
  });
  var csv = '\ufeff' + rows.map(function(r){
    return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(',');
  }).join('\n');
  dl(new Blob([csv], { type:'text/csv;charset=utf-8' }), '四年级成绩单_'+ymd()+'.csv');
  toast('成绩单已导出');
}
function dl(blob, name){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* =========================================================
   云同步：GitHub Gist 自动备份 + Supabase 云同步
   部署在公网后防本机数据丢失。配置存本机，不随学习数据一起导出。
   ========================================================= */
var SYNC_KEY = 'wb_tyc4_sync_v1';
var SB_DEFAULT_URL = 'https://yvwbwqahljgwvycfdyxs.supabase.co';
var SB_DEFAULT_KEY = 'sb_publishable_h_qgjmcA8v5YaD7ujPfRsg_1hIQj7sX';
function getSyncCfg(){
  try { return JSON.parse(localStorage.getItem(SYNC_KEY) || '{}'); } catch(e){ return {}; }
}
function setSyncCfg(o){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(o)); } catch(e){} }
function collectBackup(){ return { app:'四年级学习台', version:1, exportedAt:new Date().toISOString(), state:S }; }
var _syncTimer = null;
function scheduleSync(){
  var c = getSyncCfg();
  if (!c.autoGist && !c.autoSb) return;
  if (_syncTimer) return;
  _syncTimer = setTimeout(function(){ _syncTimer = null; runSync(); }, 1500);
}
function runSync(){
  var c = getSyncCfg();
  var total = (c.autoGist?1:0) + (c.autoSb?1:0);
  if (!total) return;
  var done = 0;
  function fin(){ done++; if (done===total && done>0) toast('云同步完成'); }
  if (c.autoGist) syncToGist(fin);
  if (c.autoSb) syncToSupabase(fin);
}
function syncToGist(cb){
  var c = getSyncCfg();
  if (!c.gistToken) { cb && cb(); return; }
  var payload = collectBackup();
  var body = { public:false, files:{ 'tyc4-backup.json':{ content: JSON.stringify(payload, null, 2) } } };
  var url = c.gistId ? ('https://api.github.com/gists/'+c.gistId) : 'https://api.github.com/gists';
  var method = c.gistId ? 'PATCH' : 'POST';
  fetch(url, { method:method, headers:{ 'Authorization':'Bearer '+c.gistToken, 'Content-Type':'application/json', 'Accept':'application/vnd.github+json' }, body: JSON.stringify(body) })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(j){ if (j && j.id) { c.gistId = j.id; setSyncCfg(c); } toast('已同步到 GitHub Gist'); cb && cb(); })
    .catch(function(e){ toast('GitHub 同步失败：'+(e.message||e)); cb && cb(); });
}
function syncToSupabase(cb){
  var c = getSyncCfg();
  if (!c.sbUrl || !c.sbKey) { cb && cb(); return; }
  var table = c.sbTable || 'study_desk_sync';
  var base = c.sbUrl.replace(/\/$/,'');
  var payload = collectBackup();
  var row = { id:'tyc4-default', data: payload, updated_at: new Date().toISOString() };
  fetch(base + '/rest/v1/' + table + '?on_conflict=id', { method:'POST', headers:{ 'apikey':c.sbKey, 'Authorization':'Bearer '+c.sbKey, 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates' }, body: JSON.stringify([row]) })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(){ toast('已同步到 Supabase'); cb && cb(); })
    .catch(function(e){ toast('Supabase 同步失败：'+(e.message||e)); cb && cb(); });
}
function syncNow(){
  var c = getSyncCfg();
  if (!c.gistToken && !c.sbUrl) { toast('请先在「设置 → 云同步」填写配置'); return; }
  var total = (c.gistToken?1:0) + (c.sbUrl?1:0);
  var done = 0;
  function fin(){ done++; if (done===total) toast('云同步完成'); }
  if (c.gistToken) syncToGist(fin);
  if (c.sbUrl) syncToSupabase(fin);
}
function pullFromGist(){
  var c = getSyncCfg();
  if (!c.gistToken || !c.gistId) { toast('请先配置 GitHub Gist 并同步过一次'); return; }
  fetch('https://api.github.com/gists/'+c.gistId, { headers:{ 'Authorization':'Bearer '+c.gistToken, 'Accept':'application/vnd.github+json' } })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(j){
      var f = j.files && j.files['tyc4-backup.json'];
      if (!f || !f.content) throw new Error('备份文件不存在');
      window.__pendingImport = JSON.parse(f.content).state;
      offerImport();
    }).catch(function(e){ toast('拉取失败：'+(e.message||e)); });
}
function pullFromSupabase(){
  var c = getSyncCfg();
  if (!c.sbUrl || !c.sbKey) { toast('请先配置 Supabase'); return; }
  var table = c.sbTable || 'study_desk_sync';
  var base = c.sbUrl.replace(/\/$/,'');
  fetch(base + '/rest/v1/' + table + '?id=eq.tyc4-default&select=data', { headers:{ 'apikey':c.sbKey, 'Authorization':'Bearer '+c.sbKey } })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(rows){
      if (!rows || !rows.length || !rows[0].data) throw new Error('没有云端数据');
      window.__pendingImport = rows[0].data.state;
      offerImport();
    }).catch(function(e){ toast('拉取失败：'+(e.message||e)); });
}
function offerImport(){
  var st = window.__pendingImport; if(!st) return;
  var cnt = (st.exams||[]).length + (st.wrong||[]).length + (st.tasks||[]).length;
  modal('从云端恢复', '<p>云端备份包含 <b>'+cnt+'</b> 条记录。导入会覆盖当前设备数据，确定继续吗？</p>',
    '<button class="btn" onclick="App.closeModal()">取消</button><button class="btn pri" onclick="App.doImport()">确定恢复</button>');
}
function saveCloudCfg(){
  var c = getSyncCfg();
  c.gistToken = (document.getElementById('gistToken').value||'').trim();
  c.gistId = (document.getElementById('gistId').value||'').trim();
  c.autoGist = !!document.getElementById('autoGist').checked;
  c.sbUrl = (document.getElementById('sbUrl').value||'').trim();
  c.sbKey = (document.getElementById('sbKey').value||'').trim();
  c.sbTable = (document.getElementById('sbTable').value||'').trim();
  c.autoSb = !!document.getElementById('autoSb').checked;
  setSyncCfg(c);
  toast('云同步配置已保存');
}
/* 自动同步：每 3 分钟检查一次，并在关闭页面时尽力同步 */
(function startAutoSync(){
  setInterval(function(){ scheduleSync(); }, 180000);
  window.addEventListener('beforeunload', function(){ try { runSync(); } catch(e){} });
})();

/* =========================================================
   访问密码保护（部署在公网后防陌生人随意查看）
   ========================================================= */
var LOCK_KEY = 'wb_tyc4_lock_v1';
var LOCK_HASH = 'wb_tyc4_lockhash_v1';
var PRESET_LOCK_PWD = '5200817'; // 部署预设访问密码（首次打开即用，可在设置中修改）

function hashStr(s){
  // 简单哈希：不存明文密码，防一眼可见。非加密级安全。
  var h = 5381;
  for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) & 0xFFFFFFFF; }
  return (h >>> 0).toString(36);
}
function getLockHash(){
  try { return localStorage.getItem(LOCK_HASH) || ''; } catch(e){ return ''; }
}
function setLockHash(h){
  try { localStorage.setItem(LOCK_HASH, h); } catch(e){}
}
function clearLock(){
  try { localStorage.removeItem(LOCK_HASH); } catch(e){}
}

function showLockScreen(mode){
  // mode: 'set' = 首次设置密码, 'enter' = 输入密码进入
  var isSet = mode === 'set';
  var ls = document.getElementById('lockScreen');
  ls.innerHTML = ''
    + '<div class="lock-card">'
    + '<div class="lock-logo">'
    + svg('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', 28, 2.2)
    + '</div>'
    + '<h2>' + (isSet ? '设置访问密码' : '请输入密码') + '</h2>'
    + '<div class="lk-sub">' + (isSet
        ? '部署在公网后，设一个密码防止陌生人打开。下次打开需要输入。'
        : '这是您孩子的专属学习台，请输入密码进入。') + '</div>'
    + '<div class="lock-input-grp">'
    + svg('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', 18, 2)
    + '<input class="lock-input" id="lockPwd" type="password" maxlength="8" placeholder="'
    + (isSet ? '设置 4-8 位密码' : '输入密码') + '" autocomplete="off" inputmode="numeric">'
    + '</div>'
    + (isSet ? '<div class="lock-input-grp">'
      + svg('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', 18, 2)
      + '<input class="lock-input" id="lockPwd2" type="password" maxlength="8" placeholder="再输一次确认" autocomplete="off" inputmode="numeric">'
      + '</div>' : '')
    + '<button class="lock-btn" id="lockBtn" onclick="App.unlock()">' + (isSet ? '设置并进入' : '进入') + '</button>'
    + '<div class="lock-err" id="lockErr"></div>'
    + '<div class="lock-hint">'
    + svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>', 12, 2)
    + ' 密码只存在本机浏览器，不上传服务器。<br>'
    + (isSet ? '<b>请牢记密码</b>，忘记后只能清空浏览器数据重置。' : '忘记密码？连续输错 5 次可重置。')
    + '</div>'
    + (isSet ? '' : '<button class="lock-toggle" onclick="App.lockReset()">忘记密码，重置</button>')
    + '</div>';
  ls.classList.remove('hide');
  // 回车提交
  var inp = document.getElementById('lockPwd');
  if (inp) { inp.focus(); inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') App.unlock(); });
    if (isSet) { var inp2 = document.getElementById('lockPwd2'); if (inp2) inp2.addEventListener('keydown', function(e){ if (e.key === 'Enter') App.unlock(); }); }
  }
}
function hideLockScreen(){
  var ls = document.getElementById('lockScreen');
  ls.classList.add('hide');
  setTimeout(function(){ ls.innerHTML = ''; }, 400);
}
var lockTries = 0;
function unlock(){
  var pwd = document.getElementById('lockPwd').value;
  var err = document.getElementById('lockErr');
  if (isSetMode) {
    // 设置密码模式
    var pwd2 = document.getElementById('lockPwd2');
    var pwd2v = pwd2 ? pwd2.value : '';
    if (pwd.length < 4) { err.textContent = '密码至少 4 位'; return; }
    if (pwd !== pwd2v) { err.textContent = '两次输入不一致'; return; }
    setLockHash(hashStr(pwd));
    hideLockScreen();
    initApp();
  } else {
    // 验证密码模式
    if (hashStr(pwd) === getLockHash()) {
      lockTries = 0;
      hideLockScreen();
      initApp();
    } else {
      lockTries++;
      err.textContent = '密码不对，还剩 ' + Math.max(0, 5 - lockTries) + ' 次机会';
      document.getElementById('lockPwd').value = '';
      if (lockTries >= 5) { resetLock(); }
    }
  }
}
var isSetMode = false;
function resetLock(){
  clearLock();
  lockTries = 0;
  var e = document.getElementById('lockErr');
  if (e) e.innerHTML = '已重置，请重新设置密码';
  setTimeout(function(){ showLockScreen('set'); }, 600);
}
function lockReset(){
  var ls = document.getElementById('lockScreen');
  ls.innerHTML = ''
    + '<div class="lock-card">'
    + '<div class="lock-logo" style="background:linear-gradient(135deg,#DC2626,#F87171)">'
    + svg('<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>', 28, 2.2)
    + '</div>'
    + '<h2>重置密码</h2><div class="lk-sub">重置会清除已设置的密码和学习台数据。<br>确定要重置吗？</div>'
    + '<button class="lock-btn" style="background:#DC2626" onclick="App.confirmReset()">是的，全部重置</button>'
    + '<button class="lock-toggle" onclick="App.cancelReset()">取消，返回输入密码</button>'
    + '</div>';
}
function confirmReset(){
  clearLock();
  try { localStorage.removeItem(KEY); } catch(e){}
  showLockScreen('set');
}
function cancelReset(){ showLockScreen('enter'); }

function initApp(){

  document.getElementById('appSub').textContent = S.profile.school + ' · 四年级';

// 设置里加修改密码/关闭密码
function lockSettings(){
  var has = !!getLockHash();
  var body = has
    ? '<div style="font-size:14px;color:var(--tx2);line-height:1.7;margin-bottom:14px">当前已设置访问密码。'
      + '可以修改密码或关闭密码保护。</div>'

      + '部署在公网后建议开启，防止陌生人打开。</div>'
      + '<div class="fld"><label>设置密码（4-8位）</label><input type="password" id="newPwd" maxlength="8" placeholder="设置密码"></div>'
      + '<div class="fld"><label>确认密码</label><input type="password" id="newPwd2" maxlength="8" placeholder="再输一次"></div>';
  var btns = '<button class="btn" onclick="App.closeModal()">取消</button>';

  btns += '<button class="btn pri" onclick="App.saveLock()">保存</button>';
  modal('访问密码', body, btns);
}
function saveLock(){
  var p1 = document.getElementById('newPwd').value;
  var p2 = document.getElementById('newPwd2').value;

function disableLock(){

(function boot(){
